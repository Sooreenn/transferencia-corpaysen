<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transferencia · Corpaysen</title>
<meta name="theme-color" content="#ec5a24">
<style>
  :root { --naranjo: #ec5a24; --tinta: #0e2f33; --calipso: #0f8a95; --suave: #e8f4f3; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; background: var(--naranjo); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--tinta); }
  header { padding: 36px 20px 26px; text-align: center; color: #fff; }
  h1 { font-size: 30px; font-weight: 900; line-height: 1.05; }
  header p { margin-top: 8px; font-size: 13px; letter-spacing: .5px; opacity: .95; }
  main { background: #fff; border-radius: 28px 28px 0 0; padding: 24px 18px calc(30px + env(safe-area-inset-bottom)); min-height: 70vh; max-width: 560px; margin: 0 auto; }
  .todo { width: 100%; border: 0; border-radius: 16px; padding: 20px; font-size: 19px; font-weight: 800; color: #fff; background: var(--calipso); box-shadow: 0 4px 0 #0a646c; transition: transform .1s; }
  .todo:active { transform: translateY(3px); box-shadow: 0 1px 0 #0a646c; }
  .todo.ok { background: #1f9d55; box-shadow: 0 4px 0 #157040; }
  .nota { margin: 12px 4px 22px; font-size: 13px; color: #557; text-align: center; line-height: 1.4; }
  .campo { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--suave); margin-bottom: 10px; }
  .campo div { flex: 1; min-width: 0; }
  .campo small { display: block; font-size: 12px; font-weight: 700; color: var(--calipso); text-transform: uppercase; letter-spacing: .5px; }
  .campo span { display: block; margin-top: 2px; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .campo button { border: 2px solid var(--calipso); background: #fff; color: var(--calipso); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .campo button.ok { background: #1f9d55; border-color: #1f9d55; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Transferencia<br>electrónica</h1>
  <p>CORPORACIÓN DE DESARROLLO PRODUCTIVO LITORAL DE AYSÉN</p>
</header>
<main>
  <button class="todo" id="todo">Copiar todos los datos</button>
  <p class="nota">O copia uno por uno, según te los pida tu banco.</p>
  <div id="campos"></div>
</main>
<script>
  const datos = [
    ["Nombre", "Corporación de Desarrollo Productivo Litoral de Aysén"],
    ["RUT", "65.095.621-4"],
    ["Banco", "Banco Santander"],
    ["Tipo de cuenta", "Cuenta corriente"],
    ["Número de cuenta", "0-000-7212801-0"],
    ["Correo de confirmación", "mmancilla@corpaysen.cl"],
  ];

  // navigator.clipboard necesita https y un toque; el textarea es el respaldo
  // para navegadores viejos o vistas embebidas (Instagram, WhatsApp).
  async function copiar(texto) {
    try { await navigator.clipboard.writeText(texto); return true; } catch {}
    const t = document.createElement("textarea");
    t.value = texto; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, texto.length);
    const ok = document.execCommand("copy"); t.remove(); return ok;
  }

  function avisar(boton, original) {
    boton.classList.add("ok"); boton.textContent = "¡Copiado!";
    setTimeout(() => { boton.classList.remove("ok"); boton.textContent = original; }, 1800);
  }

  const campos = document.getElementById("campos");
  for (const [etiqueta, valor] of datos) {
    const fila = document.createElement("div");
    fila.className = "campo";
    fila.innerHTML = `<div><small></small><span></span></div><button>Copiar</button>`;
    fila.querySelector("small").textContent = etiqueta;
    fila.querySelector("span").textContent = valor;
    const b = fila.querySelector("button");
    b.onclick = async () => { if (await copiar(valor)) avisar(b, "Copiar"); };
    campos.appendChild(fila);
  }

  const todo = document.getElementById("todo");
  todo.onclick = async () => {
    const texto = datos.map(([e, v]) => `${e}: ${v}`).join("\n");
    if (await copiar(texto)) avisar(todo, "Copiar todos los datos");
  };
</script>
</body>
</html>
